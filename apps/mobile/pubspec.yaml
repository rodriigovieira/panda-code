name: panda_code_mobile
description: Panda Code mobile companion — pair, trigger, and watch Claude Code sessions on your Mac.
publish_to: 'none'

version: 1.3.1+202607310119

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Convex realtime client. This repo carries a patched fork because the upstream
  # package needs project-specific fixes for mutation encoding. Do not replace it
  # with the upstream pub package unless you are deliberately updating the fork.
  convex_flutter:
    path: packages/convex_flutter

  # State
  flutter_riverpod: ^2.6.1

  # E2E crypto — XSalsa20-Poly1305 (must interop with the desktop's tweetnacl/libsodium).
  # See docs/protocol.md §3.
  pinenacl: ^0.6.0

  # Pairing (QR scan) + secure key storage
  mobile_scanner: ^5.2.3
  flutter_secure_storage: ^9.2.2

  # App lock — Face ID / Touch ID / device passcode
  local_auth: ^2.3.0

  # Rendering conversation items
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2 # direct dep: custom code-block builder
  flutter_highlight: ^0.7.0 # syntax highlighting for code blocks / tool output
  highlight: ^0.7.0 # highlight AST, re-tokenised to tint search matches in code

  # /export — hands the rendered transcript to the iOS share sheet, which is
  # where "save to Files", AirDrop and Mail live. There is no user-writable
  # filesystem to target directly on iOS, so this is the export destination.
  share_plus: ^10.1.4

  # Utils
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  # On-device cache of sent image attachments, so image-only user messages
  # re-render their thumbnails after a reload (the relay never carries the
  # bytes back — see remote_image_store.dart).
  path_provider: ^2.1.4
  image_picker: ^1.2.3
  # Clipboard image read — Flutter's Clipboard is text-only, so pasting a
  # screenshot needs this. (iOS's native field only offers "Scan Text".)
  pasteboard: ^0.2.0
  # Pure-Dart decode/resize/re-encode. Attachments ride inside a single sealed
  # relay command doc, which Convex caps at 1 MiB — a raw photo/screenshot blows
  # past that and the send fails. We downscale + JPEG-compress before sending
  # (see image_prep.dart). Pure Dart so no extra iOS/Android native config.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  custom_lint: ^0.7.6
  panda_code_lints:
    path: tools/panda_code_lints
  # Generates the platform launcher icons from the Panda Code logo.
  # Regenerate with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png

# App launcher icon. Both PNGs come from `node scripts/icon/render.mjs` at the
# repo root, which rasterises the one artwork source (scripts/icon/panda-mark.mjs).
# app-icon.png is the full-bleed, square, alpha-free build; panda-logo.png is the
# rounded one with a transparent margin. Never point this at panda-logo.png: iOS
# would mask corners it already has and leave wedges of background showing.
# remove_alpha_ios stays on as a guard (iOS rejects icons with alpha).
flutter_launcher_icons:
  image_path: assets/app-icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: '#101114'
